name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: manifold-companion-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Clean main exposes only the deterministic client production build.
      # Server tests are not present on this source head; do not claim a
      # broader check until that separate candidate work is reviewed.
      - name: Build client
        run: npm run build

      - name: Check deployment contract
        run: node --test deploy/deployment-contract.test.mjs
